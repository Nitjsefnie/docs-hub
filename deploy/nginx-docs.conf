server {
    listen 443 ssl;
    server_name docs.nitjsefni.eu;
    ssl_certificate     /etc/ssl/cloudflare/nitjsefni.eu.pem;
    ssl_certificate_key /etc/ssl/cloudflare/nitjsefni.eu.key;
    client_max_body_size 16m;
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
