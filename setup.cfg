[pycodestyle]
# 100 rather than 79: this codebase wraps at 100 throughout, and re-wrapping
# every route handler to satisfy a number nobody here writes to would be the
# gate changing the code rather than finding defects in it.
max-line-length = 100
exclude = .venv, .git, store, node_modules, __pycache__
# `ignore` REPLACES pycodestyle's defaults rather than adding to them, and
# pycodestyle has no extend-ignore (that is flake8), so the defaults are
# restated here. Dropping them re-enables the mutually exclusive W503/W504
# pair. Nothing beyond the defaults is ignored -- the tree satisfies the
# plain rules, and the one violation this gate found on its first run (four
# imports on one line in tests/test_cli.py) was fixed rather than silenced.
ignore = E121,E123,E126,E226,E24,E704,W503,W504
